<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скетчи p5.js</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root{--bg:#e8e5f0;--ink:#1b1a2e;--card:#f6f4fb;--accent:#ff4f5e;--mute:#6b6880}
  @media (prefers-color-scheme:dark){:root{--bg:#14132200;--bg:#141322;--ink:#ece9f7;--card:#1e1c33;--mute:#9a97b2}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
  header{padding:48px 20px 24px;max-width:1100px;margin:auto}
  h1{font-size:clamp(40px,10vw,88px);line-height:.95;margin:0;font-weight:800;letter-spacing:-.03em}
  header p{color:var(--mute);margin:12px 0 0;max-width:46ch}
  main{max-width:1100px;margin:auto;padding:12px 20px 60px;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:var(--card);border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:14px;overflow:hidden}
  .card:focus-visible,.close:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .view{aspect-ratio:1;background:#000}
  .view canvas{display:block;width:100%!important;height:100%!important}
  .meta{padding:12px 14px 14px}
  .meta b{display:block;font-size:18px}
  .meta span{color:var(--mute);font-size:14px}
  dialog{border:0;padding:0;background:var(--card);color:var(--ink);border-radius:16px;width:min(92vw,760px);max-height:94vh}
  dialog::backdrop{background:#000a}
  .big{aspect-ratio:1;max-height:70vh;margin:auto;background:#000}
  .info{padding:14px 18px 18px}
  .info h2{margin:0;font-size:24px}
  .info p{margin:4px 0 0;color:var(--mute)}
  .close{position:absolute;top:10px;right:10px;z-index:2;border:0;border-radius:99px;background:var(--accent);color:#fff;font:inherit;font-weight:800;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>Polina's sketches :3</h1>
  <p>Enjoy all the sketches</p>
</header>
<main id="grid"></main>

<dialog id="dlg">
  <button class="close" id="close">Close</button>
  <div class="big" id="big"></div>
  <div class="info"><h2 id="dt"></h2><p id="dd"></p></div>
</dialog>

<script>
/* ============================================================
   КАК ДОБАВИТЬ РАБОТУ
   Скопируйте любой объект в массиве WORKS ниже и замените:
   title, year, note и функцию sketch.
   Скетч пишется в instance-режиме: используйте p.setup, p.draw,
   p.circle(...) вместо глобальных setup, draw, circle(...).
   Размер холста берите из переменной s (сторона квадрата).
   ============================================================ */
const WORKS = [
  {
    title: "Apples", year: 2026, note: "Sketch 1",
    sketch: (p, s) => {
      const size = 50, start = 0, distbetween = 100;
      const colors = ['red', 'yellow', 'green'];
      p.setup = () => {
        p.createCanvas(s, s);
        p.scale(s / 1000);
        p.background(p.random(255), p.random(255), p.random(255));
        p.noStroke();
        for (let i = 0; i < 30; i++) {
          for (let j = 0; j < 30; j++) {
            p.fill(p.random(colors));
            p.ellipse(start + i * distbetween + size / 2, start + j * distbetween, size, size);
            p.circle(start + i * distbetween, start + j * distbetween, size);
            p.fill(0, 0, 0);
            p.rect(start + i * distbetween + 10, start + j * distbetween - 50, 4, 30);
          }
      }
    };
  }

  },
  {
    title: "DVD", year: 2026, note: "Sketch 2",
    sketch: (p, s) => {
      let x = 10, y = 10;
      let speedX = 2, speedY = -2;
      p.setup = () => {
        p.createCanvas(s, s);
      };
      p.draw = () => {
        p.background(y, x, x, y);
        p.scale(s / 400);
        p.noStroke();
        p.fill(255, 196, 254);
        p.ellipse(x, y, 100, 40);
        p.fill(0, 0, 0);
        p.textSize(30);
        p.textFont('Times New Roman');
        p.text('DVD', x - 30, y + 10);
        if (x > 400 || x < 0) speedX = speedX * -1;
        if (y > 400 || y < 0) speedY = speedY * -1;
        x = x + speedX;
        y = y + speedY;
      };
    }
  },
  {
    title: "Rectangles", year: 2026, note: "Sketch 3",
    sketch: (p, s) => {
      p.setup = () => {
        p.createCanvas(s, s);
      };
      p.draw = () => {
        p.background(117, 66, 116, 10);
        p.scale(s / 400);
        p.noStroke();
        p.fill(255, 196, 254, 15);
        p.rect(p.mouseX * 400 / s, p.mouseY * 400 / s, 100, 100);
      };
    }
  }, 
  
  {
    title: "Boxes", year: 2026, note: "Sketch 4",
    sketch: (p, s) => {
      let x = 10, y = 10;
      let speedX = 5, speedY = 2;
      p.setup = () => {
        p.createCanvas(s, s);
      };
      p.draw = () => {
        p.background(0, 0, 0);
        p.scale(s / 400);
        p.noStroke();
        p.fill(p.random(255), p.random(255), p.random(255));
        p.rect(y, x, 100, x, 200, 100);
        p.rect(y - 100, x - 100, 100, x, 200, 100);
        p.rect(y + 100, x + 100, 100, x + 100, 200, 100);
        if (x > 400 || x < 0) speedX = speedX * -1;
        if (y > 400 || y < 0) speedY = speedY * -1;
        x = x + speedX;
        y = y + speedY;
      };
    }
  },
  {
    title: "Squares and circles", year: 2026, note: "Sketch 5",
    sketch: (p, s) => {
      const start = 20, distbetween = 20;
      p.setup = () => {
        p.createCanvas(s, s);
        p.scale(s / 1000);
        p.background(220, 20, 28);
        p.noFill();
        for (let i = 0; i < 53; i++) {
          for (let j = 0; j < 53; j++) {
            p.rect(start + i * distbetween, start + j * distbetween, 40);
            p.circle(start + i * distbetween - 40, start + j * distbetween - 40, 30);
          }
        }
      };
    }
  },
   {
    title: "Circle trail", year: 2026, note: "Move the mouse over the canvas.",
    sketch: (p, s) => {
      p.setup = () => {
        p.createCanvas(s, s);
      };
      p.draw = () => {
        p.background(10, 10, 116, 5);
        p.scale(s / 400);
        p.noFill();
        p.stroke(255, 25, 0);
        p.circle(p.mouseX * 400 / s, p.mouseY * 400 / s, 100);
      };
    }
  },
   {
    title: "Shapes grid", year: 2026, note: "Sketch 7",
    sketch: (p, s) => {
      const start = 20, distbetween = 50;
      p.setup = () => {
        p.createCanvas(s, s);
        p.scale(s / 1000);
        p.background(p.random(255), p.random(255), p.random(255));
        p.noStroke();
        for (let i = 0; i < 100; i++) {
          for (let j = 0; j < 100; j++) {
            p.rect(start + i * distbetween, start + j * distbetween, 40);
            p.circle(start + i * distbetween, start + j * distbetween, 30);
            p.triangle(start + i * distbetween + 50, start + j * distbetween, 30, 40, 20, 30);
          }
        }
      };
    }
  },
   {
    title: "Red composition", year: 2026, note: "Sketch 8",
    sketch: (p, s) => {
      const start = 0, distbetween = 30;
      p.setup = () => {
        p.createCanvas(s, s);
        p.scale(s / 400);
        p.background(220, 10, 15);
        p.rect(20, 20, 100, 100);
        p.rect(300, 300, 30, 100);
        p.rect(250, 180, 240, 10);
        p.rect(-10, 300, 100, 40);
        p.triangle(150, 150, 300, 400, 90, 200);
        p.triangle(360, 50, 100, 10, 300, 100);
        for (let i = 0; i < 14; i++) {
          for (let j = 0; j < 14; j++) {
            p.circle(start + i * distbetween, start + j * distbetween, 10);
          }
        }
      };
    }
  },
   {
    title: "Triangles", year: 2026, note: "Sketch 9",
    sketch: (p, s) => {
      const size = 300;
      p.setup = () => {
        p.createCanvas(s, s);
        p.scale(s / 400);
        p.background(p.random(255), p.random(255), p.random(255));
        p.noStroke();
        for (let i = 0; i < 100; i++) {
          p.fill(p.random(255), p.random(255), p.random(255));
          p.triangle(p.random(400), p.random(400), size, size, p.random(400), p.random(400));
        }
      };
    }
  },
   {
    title: "Color grid", year: 2026, note: "Sketch 10",
    sketch: (p, s) => {
      const size = 10, start = 0, distBetween = 10;
      p.setup = () => {
        p.createCanvas(s, s);
        p.scale(s / 250);
        p.background(p.random(250), p.random(250), p.random(250));
        p.noStroke();
        for (let i = 0; i < 25; i++) {
          for (let j = 0; j < 25; j++) {
            p.fill(start + i * distBetween, 0, start + j * distBetween);
            p.rect(start + i * distBetween, start + j * distBetween, size, size);
            p.fill(start + i * distBetween, p.random(40, 100), start + j * distBetween);
            p.circle(start + i * distBetween, start + j * distBetween, size);
          }
        }
      };
    }
  },
I kept the loops at 100 on purpose: the triangles have fixed corners near the top-left, so the ones that start outside the canvas still stretch into the picture. I removed the unused size and the extra numbers in triangle(), which p5 ignores.

Claude works directly with your codebase

];

const grid = document.getElementById("grid");
const dlg = document.getElementById("dlg");
const big = document.getElementById("big");
let bigInst = null;

// Карточки: скетч работает, только пока карточка на экране
WORKS.forEach(w => {
  const card = document.createElement("button");
  card.className = "card";
  card.innerHTML = `<div class="view"></div><div class="meta"><b>${w.title}</b><span>${w.year}</span></div>`;
  grid.appendChild(card);
  const view = card.querySelector(".view");
  const inst = new p5(p => w.sketch(p, 300), view);
  inst.noLoop();
  new IntersectionObserver(([e]) => e.isIntersecting ? inst.loop() : inst.noLoop()).observe(card);
  card.addEventListener("click", () => openWork(w));
});

function openWork(w) {
  document.getElementById("dt").textContent = w.title + ", " + w.year;
  document.getElementById("dd").textContent = w.note || "";
  const side = Math.min(700, Math.floor(Math.min(innerWidth * 0.92, innerHeight * 0.7)));
  big.style.width = side + "px";
  dlg.showModal();
  bigInst = new p5(p => w.sketch(p, side), big);
}
function closeWork() { dlg.close(); }
dlg.addEventListener("close", () => { if (bigInst) { bigInst.remove(); bigInst = null; } });
document.getElementById("close").onclick = closeWork;
dlg.addEventListener("click", e => { if (e.target === dlg) closeWork(); });
</script>
</body>
</html>
